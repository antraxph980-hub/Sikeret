<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · ANTrax ML Checker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #060d18;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(ellipse at 50% 0%, #0d1f35 0%, #060d18 70%);
        }
        .login-container {
            background: #0d1f35;
            border-radius: 20px;
            padding: 44px 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #1a3050;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3cba6b, #4a8af4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: #060d18;
            margin: 0 auto 12px;
        }
        .title {
            color: #e8ddd0;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.5px;
        }
        .title span {
            background: linear-gradient(135deg, #3cba6b, #4a8af4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #4a6078;
            font-size: 13px;
            text-align: center;
            margin-bottom: 28px;
            font-weight: 400;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            color: #8aa0b8;
            font-size: 11px;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0b1a2e;
            border: 1px solid #1a3050;
            border-radius: 10px;
            color: #e8ddd0;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3cba6b;
            box-shadow: 0 0 0 3px rgba(60, 186, 107, 0.12);
        }
        .form-group input::placeholder { color: #3a4a5e; }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3cba6b, #2a9d5a);
            color: #060d18;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 24px rgba(60, 186, 107, 0.3);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            color: #ff5c5c;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }
        .info-msg {
            color: #3cba6b;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }
        .register-link {
            text-align: center;
            margin-top: 16px;
            color: #4a6078;
            font-size: 13px;
        }
        .register-link a {
            color: #3cba6b;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .register-link a:hover { text-decoration: underline; }
        .register-form {
            display: none;
            margin-top: 20px;
            border-top: 1px solid #1a3050;
            padding-top: 20px;
        }
        .register-form.active { display: block; }
        .demo-credits {
            color: #3a4a5e;
            font-size: 11px;
            text-align: center;
            margin-top: 16px;
            font-family: 'Inter', monospace;
        }
        .admin-badge {
            display: inline-block;
            background: rgba(60, 186, 107, 0.15);
            color: #3cba6b;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 12px;
            border-left: 3px solid;
        }
        .alert-info {
            background: rgba(60, 186, 107, 0.08);
            border-color: #3cba6b;
            color: #8aa0b8;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">A</div>
        <div class="title"><span>ANTrax</span> ML Checker</div>
        <div class="subtitle">v3.0 · Secure Access Platform</div>

        <div id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
            </div>
            <button class="btn-login" id="loginBtn">Sign In</button>
            <div class="error-msg" id="loginError"></div>
            <div class="register-link">
                Need an account? <a id="showRegister">Request Access</a>
            </div>
            <div class="demo-credits">
                <span class="admin-badge">Admin</span> antrax / <span style="color:#4a6078;">admin@AntraxdevZ</span>
            </div>
        </div>

        <div class="register-form" id="registerForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUsername" placeholder="Choose a username (min 3 chars)">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Choose a password (min 6 chars)">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="regPasswordConfirm" placeholder="Confirm your password">
            </div>
            <button class="btn-login" id="registerBtn">Request Access</button>
            <div class="error-msg" id="registerError"></div>
            <div class="alert alert-info">
                Registration requests require administrator approval.
            </div>
            <div class="register-link">
                Already have an account? <a id="showLogin">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const showRegister = document.getElementById('showRegister');
        const showLogin = document.getElementById('showLogin');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const loginError = document.getElementById('loginError');
        const registerError = document.getElementById('registerError');

        // Enter key support
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });
        document.getElementById('regPasswordConfirm').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') registerBtn.click();
        });

        // Toggle forms
        showRegister.addEventListener('click', () => {
            loginForm.style.display = 'none';
            registerForm.classList.add('active');
            loginError.textContent = '';
            registerError.textContent = '';
        });

        showLogin.addEventListener('click', () => {
            loginForm.style.display = 'block';
            registerForm.classList.remove('active');
            loginError.textContent = '';
            registerError.textContent = '';
        });

        // Login
        loginBtn.addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                loginError.textContent = 'Please enter username and password';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Signing In...';
            loginError.textContent = '';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = data.redirect || '/';
                } else {
                    loginError.textContent = data.error || 'Login failed';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            } catch {
                loginError.textContent = 'Connection error. Please try again.';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Register
        registerBtn.addEventListener('click', async () => {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;

            if (!username || username.length < 3) {
                registerError.textContent = 'Username must be at least 3 characters';
                return;
            }
            if (!password || password.length < 6) {
                registerError.textContent = 'Password must be at least 6 characters';
                return;
            }
            if (password !== confirm) {
                registerError.textContent = 'Passwords do not match';
                return;
            }

            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="spinner"></span> Submitting...';
            registerError.textContent = '';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (data.success) {
                    registerError.className = 'info-msg';
                    registerError.textContent = 'Registration submitted. Please wait for admin approval.';
                    setTimeout(() => {
                        loginForm.style.display = 'block';
                        registerForm.classList.remove('active');
                        registerError.className = 'error-msg';
                        registerError.textContent = '';
                        document.getElementById('username').value = username;
                        document.getElementById('password').value = '';
                        registerBtn.disabled = false;
                        registerBtn.textContent = 'Request Access';
                    }, 2000);
                } else {
                    registerError.textContent = data.error || 'Registration failed';
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Request Access';
                }
            } catch {
                registerError.textContent = 'Connection error. Please try again.';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Request Access';
            }
        });
    </script>
</body>
</html>
